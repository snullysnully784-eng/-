<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سەعی بۆ سامانە قن خواری سێکسی</title>
    
    <!-- MathJax Config -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question {
            margin-bottom: 25px;
            padding: 15px;
            border-right: 4px solid #3498db;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .options label {
            display: block;
            margin: 8px 0;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }
        .options label:hover {
            background: #eef7fc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 تاقیکردنەوەی بیرکاری</h1>
    
    <div class="question">
        <p>١. جۆری هاوجێبوونی نەخشەی $f(x) = \frac{x \cdot |x|}{x^2 + 1}$ دیاری بکە:</p>
        <div class="options">
            <label><input type="radio" name="q1"> A) نەخشەیەکی جووته</label>
            <label><input type="radio" name="q1"> B) نەخشەیەکی تاکه</label>
            <label><input type="radio" name="q1"> C) نه هاوجێیە و نه ناهاوجێ</label>
            <label><input type="radio" name="q1"> D) هاوجێیە بە دەوری تەوەرێکدا</label>
        </div>
    </div>

    <div class="question">
        <p>٢. ژمارەی خاڵەکانی یەکتربڕینی ئاسۆیی ($x$) بۆ نەخشەی $f(x) = (x^2 - 4)\sqrt{x - 1}$ چەندە؟</p>
        <div class="options">
            <label><input type="radio" name="q2"> A) خاڵ: $(2,0), (-2,0), (1,0)$</label>
            <label><input type="radio" name="q2"> B) خاڵێک</label>
        </div>
    </div>
</div>

</body>
</html>
